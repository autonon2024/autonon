<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز أوتو نون (NON) - صانع وطباعة الباركود</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- مكتبة توليد الباركود JsBarcode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary-orange: #ea580c;
      --text-main: #0f172a;
      --border-color: #e2e8f0;
      --input-bg: #ffffff;
      --btn-blue: #0284c7;
      --btn-green: #10b981;
      --danger-red: #dc2626;
      --btn-yellow: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { direction: rtl !important; text-align: right !important; background-color: var(--bg-color); color: var(--text-main); padding: 10px; font-size: 0.9rem; }
    
    .header-top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px;
      background: var(--card-bg); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border-color); flex-wrap: wrap;
    }
    .brand-logo { display: flex; align-items: center; gap: 8px; font-size: 1.2rem; font-weight: 800; color: var(--primary-orange); }
    .btn-nav { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 7px 14px; border-radius: 20px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; cursor: pointer; }

    .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 14px; }
    @media(max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

    .card-box { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); padding: 16px; margin-bottom: 14px; position: relative; }
    .card-title { color: var(--primary-orange); font-size: 1.05rem; font-weight: 800; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .control-toolbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--card-bg);
      padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 14px;
    }
    .btn-action { padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-action:hover { border-color: var(--primary-orange); }
    .btn-primary { background: var(--primary-orange); color: white; border: none; }
    .btn-green { background: var(--btn-green); color: white; border: none; }

    .form-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .form-field label { font-size: 0.82rem; font-weight: 700; }
    .form-field input, .form-field select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); background: var(--input-bg);
      border-radius: 6px; font-size: 0.88rem; font-weight: 600; color: var(--text-main); outline: none; text-align: right;
    }

    /* معاينات الباركود الشبكية */
    .barcode-sheet-preview {
      background: #ffffff; color: #000000; padding: 20px; border-radius: 8px; border: 1px solid #cbd5e1;
      max-height: 600px; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; justify-items: center;
    }
    .barcode-item-box {
      border: 1px dashed #94a3b8; padding: 10px; text-align: center; background: #fff; width: 100%; border-radius: 6px;
    }
    .barcode-item-box svg { max-width: 100%; height: 45px; }
    .barcode-text-val { font-size: 0.75rem; font-weight: bold; margin-top: 4px; }
    .item-price-tag { font-size: 0.75rem; color: #ea580c; font-weight: 800; }

    .items-list-sidebar { max-height: 450px; overflow-y: auto; }
    .item-row { padding: 8px 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 0.85rem; }
    .item-row:hover { background: rgba(234, 88, 12, 0.05); }

    @media print {
      body * { visibility: hidden; }
      #printableBarcodeArea, #printableBarcodeArea * { visibility: visible; }
      #printableBarcodeArea { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="header-top-bar">
    <div class="brand-logo">
      <i class="fa-solid fa-barcode"></i>
      <span>مركز أوتو نون (NON) - صانع وطباعة الباركود والتسلسل</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <a href="wash.html" class="btn-nav"><i class="fa-solid fa-water-ladder"></i> المغسلة</a>
      <a href="accounting.html" class="btn-nav"><i class="fa-solid fa-cash-register"></i> الحسابات</a>
      <a href="diagnosis.html" class="btn-nav"><i class="fa-solid fa-stethoscope"></i> التشخيص</a>
      <a href="index.html" class="btn-nav"><i class="fa-solid fa-house"></i> الاستقبال</a>
    </div>
  </div>

  <!-- شريط الأدوات -->
  <div class="control-toolbar">
    <div style="display:flex; align-items:center; gap:6px;">
      <label style="font-weight:700; font-size:0.8rem;">بداية التسلسل:</label>
      <input type="number" id="startSequenceNum" value="100" style="width: 90px; padding:6px; border:1px solid var(--border-color); border-radius:6px; text-align:center;" oninput="generateBarcodesPreview()">
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <label style="font-weight:700; font-size:0.8rem;">العدد المطلوب:</label>
      <input type="number" id="barcodeCountQty" value="12" min="1" max="100" style="width: 65px; padding:6px; border:1px solid var(--border-color); border-radius:6px; text-align:center;" oninput="generateBarcodesPreview()">
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <label style="font-weight:700; font-size:0.8rem;">السعر:</label>
      <input type="text" id="manualItemPrice" value="0" style="width: 80px; padding:6px; border:1px solid var(--border-color); border-radius:6px; text-align:center;" placeholder="السعر">
    </div>
    
    <button class="btn-action btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة عادية A4</button>
    <button class="btn-action btn-green" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة برنتر حراري</button>
  </div>

  <div class="main-grid">
    <!-- قسم المعاينة والشبكة التسلسلية -->
    <div class="card-box">
      <div class="card-title">
        <span><i class="fa-solid fa-table-cells"></i> معاينة الباركود المتسلسل (سنة + شهر + تسلسل)</span>
        <span id="activePrefixLabel" style="font-size: 0.8rem; font-weight: bold; color: var(--primary-orange);"></span>
      </div>
      <div id="printableBarcodeArea" class="barcode-sheet-preview">
        <!-- يتم توليد الأكواد المتسلسلة هنا -->
      </div>
    </div>

    <!-- قسم قائمة الأصناف للاختيار -->
    <div>
      <div class="card-box">
        <div class="card-title">
          <span><i class="fa-solid fa-boxes-stacked"></i> المخزن / الأصناف</span>
        </div>
        <div class="form-field">
          <input type="text" id="searchInventoryInput" placeholder="بحث في الأصناف..." oninput="filterInventoryList()">
        </div>
        <div class="items-list-sidebar" id="inventoryItemsListContainer">
          <small style="color:#64748b;">جاري تحميل الأصناف...</small>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAXcNnF3y6QYc9Zq19630SE1NuFbdeNloM",
      authDomain: "auto-non.firebaseapp.com",
      projectId: "auto-non",
      storageBucket: "auto-non.firebasestorage.app",
      messagingSenderId: "480852907486",
      appId: "1:480852907486:web:b931d45fa2a9d6197c794f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let inventoryItems = [];

    db.collection('inventory').onSnapshot(snapshot => {
      inventoryItems = [];
      snapshot.forEach(doc => {
        inventoryItems.push({ id: doc.id, ...doc.data() });
      });
      renderInventorySidebar(inventoryItems);
    });

    function renderInventorySidebar(items) {
      const container = document.getElementById('inventoryItemsListContainer');
      container.innerHTML = '';
      if (items.length === 0) {
        container.innerHTML = `<small style="color:#64748b; display:block; text-align:center; padding:10px;">لا توجد أصناف.</small>`;
        return;
      }
      items.forEach(item => {
        container.innerHTML += `
          <div class="item-row" onclick="selectItemPrice('${item.price || 0}')">
            <div style="font-weight:800; color:var(--text-main);">${item.name}</div>
            <div style="font-size:0.75rem; color:#64748b; margin-top:2px;">السعر: ${item.price || 0} ج.م</div>
          </div>
        `;
      });
    }

    function filterInventoryList() {
      const query = document.getElementById('searchInventoryInput').value.toLowerCase();
      const filtered = inventoryItems.filter(i => i.name.toLowerCase().includes(query));
      renderInventorySidebar(filtered);
    }

    function selectItemPrice(price) {
      document.getElementById('manualItemPrice').value = price;
    }

    function generateBarcodesPreview() {
      const container = document.getElementById('printableBarcodeArea');
      const count = parseInt(document.getElementById('barcodeCountQty').value) || 12;
      const startNumInput = parseInt(document.getElementById('startSequenceNum').value) || 100;
      const price = document.getElementById('manualItemPrice').value;

      // توليد السنة والشهر تلقائياً (مثال: 2026 و 9 للشهر الحالي)
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const prefix = `${year}${month}`; // مثلاً 20269

      document.getElementById('activePrefixLabel').innerText = `البادئة: ${prefix}xx`;

      container.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const currentSerial = `${prefix}${startNumInput + i}`; // تسلسل تلقائي (20269100, 20269101, ...)

        const itemDiv = document.createElement('div');
        itemDiv.className = 'barcode-item-box';
        itemDiv.innerHTML = `
          <div style="font-size:0.7rem; font-weight:bold; margin-bottom:2px;">مركز أوتو نون</div>
          <svg id="barcode-elem-${i}"></svg>
          <div class="barcode-text-val">${currentSerial}</div>
          ${price > 0 ? `<div class="item-price-tag">السعر: ${price} ج.م</div>` : ''}
        `;
        container.appendChild(itemDiv);

        try {
          JsBarcode(`#barcode-elem-${i}`, currentSerial, {
            format: "CODE128",
            width: 1.5,
            height: 35,
            displayValue: false
          });
        } catch (e) { console.error(e); }
      }
    }

    window.onload = function() {
      generateBarcodesPreview();
    };
  </script>
</body>
</html>
